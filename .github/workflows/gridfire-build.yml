name: Gridfire Build

# gridfire_template_version: stage3-go-api/v1

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch or ref generated by Gridfire.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout generated ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...
