version: "1"

# gridfire_template_version: stage3-go-api/v1

github:
  owner: BrettHamlin
  repo: golang-gin-realworld-example-app

reviewer_dispatch:
  strategy: progressive
  clustering:
    mode: lsp_preferred
    regex_fallback: true

reviewers:
  - name: api-contracts
    file: .harness/agents/api-contracts.md
    description: Checks API route contracts, request validation, auth middleware, and response status/body shape.
    path_hints: ["**/routers.go", "**/handlers.go", "**/middlewares.go", "**/validators.go", "api/**"]
    language_hints: [go]
    mandatory_triggers: ["route", "handler", "status", "validation", "middleware", "auth"]
    passing_grade: C
    max_retries: 5

  - name: data-safety
    file: .harness/agents/data-safety.md
    description: Checks persistence, transactions, idempotency, and destructive data changes.
    path_hints: ["**/models.go", "**/database.go", "**/migrations/**", "data/**"]
    language_hints: [go, sql]
    mandatory_triggers: ["database", "transaction", "migration", "delete", "update", "idempotent"]
    passing_grade: C
    max_retries: 5

codegen:
  cli_provider: codex-cli
  default_model: gpt-5.5

ci:
  provider: github-actions
  build:
    workflow: ".github/workflows/gridfire-build.yml"
    timeout_sec: 1800
  test:
    workflow: ".github/workflows/gridfire-test.yml"
    timeout_sec: 1800
  failure_extraction:
    - source: annotations
    - source: junit-xml
      path: "test-results/*.xml"
    - source: ai-extract

gates:
  plan:
    auto_approve: true
  ac:
    auto_approve: true
  merge_review:
    auto_approve: true

inner_loop:
  reviewer_per_max: 2
  reviewer_total_max: 5
  build_max: 3
  test_max: 3
  build_test_total_max: 5
  budget_reset_on_user_changes: true
